# One-time helper: creates package-lock.json on GitHub and commits it to main.
# It runs only when this file itself is pushed, and can be deleted afterwards.
name: Create lockfile

on:
  push:
    branches: [main]
    paths: ['.github/workflows/lockfile.yml']

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Add package-lock.json (generated by the Create lockfile workflow)"
          git push
